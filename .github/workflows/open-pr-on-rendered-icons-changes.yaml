name: Update PR when icons needs re-rendered
on:
  push:
    paths:
      - '.github/workflows/open-pr-on-rendered-icons-changes.yaml'
      - 'common/accent-colors.scss.in'
      - 'icons/src/fullcolor/**'
      - 'icons/src/symlinks/**'
      - 'icons/src/scalable/**'
  schedule:
    - cron: '8 0 * * *'

jobs:
  refresh-upstream:
    name: Check for local rendered elements changes
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt install software-properties-common
          sudo add-apt-repository ppa:inkscape.dev/stable
          sudo apt update
          sudo apt install sassc python3-pip xvfb inkscape optipng scour
          sudo pip3 install meson ninja

      - name: Configure project
        run: |
          meson _build -Dmate=true

      - name: Check Source changes
        uses: dorny/paths-filter@v2
        id: check-changed
        with:
          filters: |
            default:
              - icons/src/fullcolor/default/**
            default-scalable:
              - icons/src/scalable/default/**
            mate:
              - icons/src/fullcolor/mate/**
            mate-scalable:
              - icons/src/scalable/mate/**
            accented:
              - common/accent-colors.scss.in
              - icons/src/fullcolor/accented/**
            symlinks:
              - icons/src/symlinks

      # - name: Render default icons and generate symlinks
      #   if: steps.check-changed.outputs.default == 'true'
      #   run: |
      #     xvfb-run -a -- ninja -C _build -v render+symlink-icons-default

      # - name: Render mate icons and generate symlinks
      #   if: steps.check-changed.outputs.mate == 'true'
      #   run: |
      #     xvfb-run -a -- ninja -C _build -v render+symlink-icons-mate

      # - name: Render accented icons and generate symlinks
      #   if: steps.check-changed.outputs.accented == 'true'
      #   run: |
      #     xvfb-run -a -- ninja -C _build -v render+symlink-icons-accented

      # - name: Symlink all icons
      #   if: steps.check-changed.outputs.symlinks == 'true'
      #   run: |
      #     xvfb-run -a -- ninja -C _build -v symlink-icons

      # - name: Check Rendering changes
      #   id: check-rendering
      #   run: |
      #     if git diff --exit-code $GITHUB_BASE_REF; then
      #       changed=false
      #     else
      #       changed=true
      #     fi
      #     echo "::set-output name=changed::${changed}"

      # - name: Create or update Pull Request
      #   if: steps.check-rendering.outputs.changed == 'true'
      #   uses: peter-evans/create-pull-request@v3.14.0
      #   with:
      #     commit-message: "icons: Update rendered icons and symlinks"
      #     title: Auto rendered icons updates
      #     labels: automated pr, new upstream
      #     body: "[New rendered icons / symlinks changes](https://github.com/ubuntu/yaru/actions?query=workflow%3A%22Update+PR+on+upstream+changes+once+landed+on+ubuntu%22) by GitHub Action"
      #     branch: rendered-icons
      #     token: ${{ secrets.GITHUB_TOKEN }}

      - run: git reset --hard

      - name: Optimize default SVGs
        if: steps.check-changed.outputs.default-scalable == 'true'
        run: |
          cd icons/src/scalable
          ./render-symbolic-icons.sh --variant default

      - name: Optimize mate SVGs
        if: steps.check-changed.outputs.mate-scalable == 'true'
        run: |
          cd icons/src/scalable
          ./render-symbolic-icons.sh --variant mate

      - name: Check Optimization changes
        id: check_optimization_changes
        run: |
          if git diff --exit-code $GITHUB_BASE_REF; then
            changed=false
          else
            changed=true
          fi
          echo "::set-output name=modified::${changed}"

      - name: Create or update Pull Request
        if: steps.check_optimization_changes.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@v3.14.0
        with:
          commit-message: "icons: Optimize SVGs"
          title: Auto optimized icons updates
          labels: automated pr, new upstream
          body: "[New rendered icons / symlinks changes](https://github.com/ubuntu/yaru/actions?query=workflow%3A%22Update+PR+on+upstream+changes+once+landed+on+ubuntu%22) by GitHub Action"
          branch: optimized-svgs
          token: ${{ secrets.GITHUB_TOKEN }}
